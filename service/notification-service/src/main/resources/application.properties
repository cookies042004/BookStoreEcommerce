# ===============================
# ? Server Configuration
# ===============================

# Port for Notification Service
server.port=8086

# Service name (used in Eureka + inter-service communication)
spring.application.name=notification-service



# ===============================
# ? Kafka Configuration
# ===============================

# Kafka broker address
# If running locally ? localhost:9092
# If running inside Docker ? kafka:9092
spring.kafka.bootstrap-servers=localhost:9092

# Consumer group ID
# All instances in same group share messages (load balancing)
spring.kafka.consumer.group-id=notification-group

# If no offset is found, start reading from beginning
spring.kafka.consumer.auto-offset-reset=earliest